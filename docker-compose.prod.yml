version: '3.8'

services:
  db:
    image: postgres:17
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_DATABASE}
    networks:
      - network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}"]
      interval: 30s
      timeout: 10s
      retries: 3

  pgbouncer:
    image: edoburu/pgbouncer:latest
    environment:
      - DB_USER=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_HOST=db
      - DB_NAME=${DB_DATABASE}
      - AUTH_TYPE=scram-sha-256
      - POOL_MODE=transaction
      - ADMIN_USERS=${DB_USERNAME}
    ports:
      - "6432:5432"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - network
    healthcheck:
      test: [ "CMD", "pg_isready", "-h", "localhost", "-p", "5432" ]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:5173:5173"
    command: preview -- --host --port 5173
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/dist
    networks:
      - network
    depends_on:
      websocket:
        condition: service_started

  migrator:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: migrate --force
    networks:
      - network
    depends_on:
      pgbouncer:
        condition: service_healthy
      backend:
        condition: service_started

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: octane:start --server=swoole --port=8080 --host=0.0.0.0
    ports:
      - "8080:8080"
    networks:
      - network
    depends_on:
      - pgbouncer

  queue:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: queue:work
    networks:
      - network
    restart: always
    depends_on:
      backend:
        condition: service_started
      pgbouncer:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
      redis:
        condition: service_started

  redis:
    image: redis:latest
    restart: always
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - network

  websocket:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: reverb:start --port=5000 --host=0.0.0.0
    ports:
      - "5000:5000"
    networks:
      - network
    depends_on:
      backend:
        condition: service_started
      redis:
        condition: service_started
      migrator:
        condition: service_completed_successfully

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    networks:
      - network

  grafana:
    image: grafana/grafana:latest
    ports:
      - '3000:3000'
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: false
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - network
    depends_on:
      prometheus:
        condition: service_started

volumes:
  redis_data:
  postgres_data:
  prometheus_data:
  grafana_data:

networks:
  network:
    driver: bridge